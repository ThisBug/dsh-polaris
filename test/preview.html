.ns-drawer .kv{font-size:11.8px;line-height:1.55;margin-top:4px;opacity:.92;overflow-wrap:anywhere}
.ns-drawer .kv b{opacity:.62;font-weight:500;margin-right:4px}
.ns-drawer .kvs{margin:2px 0 8px;padding:8px 10px;border-radius:10px;background:rgba(255,255,255,.05)}
/* v18 透明度 */
.ns-panel{background:linear-gradient(150deg,rgba(255,255,255,calc(var(--ns-a,.9) * .17)),rgba(255,255,255,calc(var(--ns-a,.9) * .06)) 38%,rgba(16,22,34,var(--ns-a,.9))) }
.ns-oprow{display:flex;align-items:center;gap:8px;margin:0 0 10px;font-size:11.5px;opacity:.85}
.ns-op{flex:1;height:18px;accent-color:#63b8ff;cursor:pointer}
.ns-opv{min-width:34px;text-align:right;font-variant-numeric:tabular-nums;opacity:.9}
.ns-wsrow{display:flex;align-items:center;gap:6px;margin:0 0 8px}
.ns-ws{flex:1;border-radius:10px;padding:5px 8px;font-size:12px;color:#eef2f8;background:rgba(255,255,255,.10);border:1px solid rgba(255,255,255,.18)}
/* v19 控件与记录列表 */
.ns-panel{max-height:calc(100vh - 120px)}
.ns-body{flex:1 1 auto;min-height:0}
.ns-wsrow{display:flex;align-items:center;gap:8px;margin:0 0 8px}
.ns-wslab{flex:none;font-size:11.5px;opacity:.6}
.ns-dd{position:relative;flex:1;min-width:0}

.ns-oprow>span:first-child{flex:none;width:48px;opacity:.62}

.ns-actlist{max-height:min(52vh,460px);overflow-y:auto;overflow-x:hidden;padding-right:4px;overscroll-behavior:contain}
.ns-actlist::-webkit-scrollbar{width:6px}.ns-actlist::-webkit-scrollbar-thumb{background:rgba(255,255,255,.2);border-radius:3px}

  padding:6px 4px;border-bottom:1px solid rgba(255,255,255,.06);font-size:11.5px}
.ns-act-row .t{opacity:.5}/* v20 修面板底部裁切：body 由 flex 约束，不再用固定 max-height */

/* v21 底栏独立 + 顶部间距 */
.ns-body{padding-bottom:2px}

  border-top:1px solid rgba(255,255,255,.10);background:rgba(9,14,24,.22)}

  grid-template-areas:"t tag" "d d"!important;gap:3px 8px!important;align-items:center;padding:7px 4px!important}

/* ===== v24 三主题：液态玻璃 / 黑夜 / 白天 ===== */
.ns-panel{ --ns-fg:#f2f5fb; --ns-fg2:#eef2f8; --ns-fg3:#dfe7f3;
  --ns-surf:rgba(255,255,255,.10); --ns-surf2:rgba(255,255,255,.07); --ns-surf3:rgba(255,255,255,.18);
  --ns-line:rgba(255,255,255,.22); --ns-measure:rgba(255,255,255,.14);
  --ns-input:rgba(8,12,20,.42); --ns-drawer:rgba(8,12,20,.55); --ns-dd:rgba(13,19,30,.98);
  --ns-shadow:0 24px 60px -18px rgba(0,0,0,.55); --ns-blur:blur(28px) saturate(190%);
}
.ns-panel[data-theme="dark"]{
  --ns-fg:#e8edf6; --ns-fg2:#dfe6f0; --ns-fg3:#cdd6e4;
  --ns-surf:rgba(255,255,255,.06); --ns-surf2:rgba(255,255,255,.04); --ns-surf3:rgba(255,255,255,.11);
  --ns-line:rgba(255,255,255,.14); --ns-measure:rgba(255,255,255,.10);
  --ns-input:rgba(0,0,0,.55); --ns-drawer:rgba(0,0,0,.62); --ns-dd:rgba(8,11,17,.99);
  --ns-shadow:0 26px 64px -18px rgba(0,0,0,.78); --ns-blur:blur(10px) saturate(120%);
  background:linear-gradient(150deg,rgba(28,33,44,.96),rgba(17,21,29,.97) 46%,rgba(12,16,23,.98))!important;
  border-color:rgba(255,255,255,.10)!important;
}
.ns-panel[data-theme="dark"]::before{opacity:.10!important;mix-blend-mode:screen}
.ns-panel[data-theme="dark"]::after{opacity:.16!important}
.ns-panel[data-theme="light"]{
  --ns-fg:#1a2230; --ns-fg2:#20293a; --ns-fg3:#3a4658;
  --ns-surf:rgba(15,23,38,.055); --ns-surf2:rgba(15,23,38,.04); --ns-surf3:rgba(15,23,38,.10);
  --ns-line:rgba(15,23,38,.14); --ns-measure:rgba(15,23,38,.10);
  --ns-input:rgba(255,255,255,.86); --ns-drawer:rgba(255,255,255,.92); --ns-dd:rgba(255,255,255,.99);
  --ns-shadow:0 22px 56px -20px rgba(30,40,60,.30); --ns-blur:blur(26px) saturate(150%);
  background:linear-gradient(150deg,rgba(255,255,255,.94),rgba(246,249,255,.90) 44%,rgba(238,243,252,.92))!important;
  border-color:rgba(15,23,38,.12)!important;
}
.ns-panel[data-theme="light"]::before{opacity:.30!important}
.ns-panel[data-theme="light"]::after{opacity:.22!important;background:radial-gradient(closest-side,rgba(99,184,255,.18),transparent 70%)!important}
.ns-panel{color:var(--ns-fg)}

.ns-panel .ns-title,.ns-panel .ns-pct{color:var(--ns-fg)}
.ns-panel .ns-goal{color:var(--ns-fg)}
.ns-panel .ns-row{background:var(--ns-surf2);border-color:var(--ns-line)}
.ns-panel .ns-row:hover{background:var(--ns-surf3)}
.ns-panel .ns-stash li{background:var(--ns-surf2);border-color:var(--ns-line)}
.ns-panel .ns-tab{background:var(--ns-surf2);color:var(--ns-fg2)}
.ns-panel .ns-tab.on{background:var(--ns-surf3);color:var(--ns-fg)}
.ns-panel .ns-ta{background:var(--ns-input);color:var(--ns-fg);border-color:var(--ns-line)}
.ns-panel .ns-drawer{background:var(--ns-drawer);border-color:var(--ns-line)}
.ns-panel .ns-ddlist{background:var(--ns-dd);border-color:var(--ns-line)}
.ns-panel .ns-ddbtn{background:var(--ns-surf);color:var(--ns-fg);border-color:var(--ns-line)}
.ns-panel .ns-act-row .d{color:var(--ns-fg3)}
.ns-panel .ns-track{background:var(--ns-measure)}
.ns-panel .ns-ghost,.ns-panel .ns-mini{background:var(--ns-surf);color:var(--ns-fg)}
.ns-panel .ns-bar,.ns-panel .ns-read{color:var(--ns-fg2)}
.ns-panel .ns-proj,.ns-panel .ns-step{color:var(--ns-fg2)}
/* 主题按钮组 */
.ns-theme{display:flex;gap:2px;margin-left:8px;padding:2px;border-radius:9px;background:var(--ns-surf2);flex:none}
.ns-thb{all:unset;cursor:pointer;width:20px;height:18px;line-height:18px;text-align:center;font-size:11px;
  border-radius:7px;color:var(--ns-fg2);transition:background .18s,color .18s,transform .18s}
.ns-thb:hover{background:var(--ns-surf3)}
.ns-thb.on{background:linear-gradient(135deg,rgba(99,184,255,.85),rgba(169,139,255,.85));color:#08121f;font-weight:700}

/* v25 旧白色常量在浅色主题下收口 */
.ns-panel[data-theme="light"] .ns-head .ns-btn{background:rgba(15,23,38,.07);color:#1a2230}
.ns-panel[data-theme="light"] .ns-head .ns-btn:hover{background:rgba(15,23,38,.13)}
.ns-panel[data-theme="light"] .ns-caps{color:#1a2230}
.ns-panel[data-theme="light"] .ns-foot{border-top-color:rgba(15,23,38,.10);background:rgba(255,255,255,.30)}
.ns-panel[data-theme="dark"] .ns-foot{border-top-color:rgba(255,255,255,.08);background:rgba(0,0,0,.28)}
.ns-panel[data-theme="light"] .ns-act-row{border-bottom-color:rgba(15,23,38,.08)}
.ns-panel[data-theme="dark"] .ns-act-row{border-bottom-color:rgba(255,255,255,.06)}
.ns-panel[data-theme="light"] .ns-pill.ns-todo{color:#5b6478}
.ns-panel[data-theme="light"] .ns-dditem{color:#20293a}
.ns-panel[data-theme="light"] .ns-dditem:hover{background:rgba(15,23,38,.08)}
.ns-panel[data-theme="light"] .ns-dditem.on{background:rgba(99,184,255,.22);color:#0b1622}
.ns-panel[data-theme="light"] .ns-tag.ui{color:#0b1622}

/* ===== v27 侧边详情抽屉 ===== */
.ns-side{position:fixed;right:0;top:0;bottom:0;width:320px;max-width:86vw;pointer-events:auto;
  padding:14px 16px 18px;overflow-y:auto;overscroll-behavior:contain;
  background:var(--ns-dd,rgba(13,19,30,.98));border-left:1px solid var(--ns-line,rgba(255,255,255,.22));
  box-shadow:-18px 0 48px -20px rgba(0,0,0,.7);color:var(--ns-fg,#f2f5fb);
  font:13px/1.55 -apple-system,'Segoe UI','Microsoft YaHei',sans-serif;
  transform:translateX(104%);transition:transform .34s cubic-bezier(.22,1.18,.36,1),opacity .2s ease;opacity:0;z-index:40}
.ns-side.on{transform:translateX(0);opacity:1}
.ns-side-hd{display:flex;align-items:flex-start;gap:8px;margin:0 0 10px}
.ns-side-hd h4{margin:0;font-size:13px;line-height:1.4;flex:1;word-break:break-all}
.ns-side .kvs{margin:0 0 10px}
.ns-side .kv{margin:0 0 6px;font-size:12px}
.ns-side .kv>b{display:inline-block;min-width:32px;opacity:.6;font-weight:500}
.ns-side .ns-ta{width:100%;box-sizing:border-box;margin:0 0 10px}
.ns-side .ns-acts{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 10px}
.ns-hist{margin-top:10px;padding-top:10px;border-top:1px solid var(--ns-line,rgba(255,255,255,.14))}
.ns-hist>b{display:block;margin:0 0 6px;font-size:12px;opacity:.7;font-weight:500}
.ns-hist .hrow{display:grid;grid-template-columns:44px 1fr auto;gap:8px;font-size:11.5px;padding:2px 0;opacity:.85}
.ns-hist .muted{opacity:.5}
.ns-side::-webkit-scrollbar{width:6px}.ns-side::-webkit-scrollbar-thumb{background:rgba(255,255,255,.2);border-radius:3px}
/* 记录「更早」 */
.ns-more{display:flex;justify-content:center;padding:10px 0 4px}
/* 偏离条目 */
.ns-dev li.ok{opacity:.55}
.ns-dev li.ok span:first-child{text-decoration:line-through}
.ns-dev .muted{opacity:.5;font-style:normal;font-size:11px}
.ns-sec .ns-pill{font-size:10px}
/* 白天主题下的细节点缀 */
.ns-panel[data-theme="light"] details>summary .chev{color:#4a5568}
.ns-panel[data-theme="light"] .ns-track .ns-fill{background:linear-gradient(90deg,#2aa06a,#2f7fd8 60%,#7a5cd8)}
.ns-panel[data-theme="light"] .ns-meta span{color:#43506a}
.ns-panel[data-theme="light"] .ns-sec summary span.cnt{color:#5b6478}
.ns-panel[data-theme="dark"] .ns-side{background:rgba(8,11,17,.99)}
.ns-panel[data-theme="light"] .ns-side{background:rgba(255,255,255,.99);color:#1a2230}

/* v28 侧边抽屉定位：优先贴在面板左侧，屏幕够宽时不压面板 */
.ns-side{right:auto;left:0;top:0;bottom:0}
.ns-side.on{transform:translateX(0)}
@media (min-width:900px){
  .ns-side{left:auto;right:calc(22px + 340px + 14px);top:96px;bottom:96px;border-radius:18px;border:1px solid var(--ns-line,rgba(255,255,255,.22));
    box-shadow:0 26px 60px -22px rgba(0,0,0,.6)}
}
@media (max-width:899px){
  .ns-side{left:auto;right:12px;top:60px;bottom:60px;width:min(320px,calc(100vw - 24px));border-radius:16px}
}

/* v29 抽屉自身的主题变量（不在 .ns-panel 内，需要独立定义） */
.ns-side{--ns-fg:#f2f5fb;--ns-fg2:#eef2f8;--ns-line:rgba(255,255,255,.22);--ns-dd:rgba(13,19,30,.98);
  --ns-surf:rgba(255,255,255,.10);--ns-surf2:rgba(255,255,255,.07);--ns-input:rgba(8,12,20,.42)}
.ns-side[data-theme="dark"]{--ns-fg:#e8edf6;--ns-fg2:#dfe6f0;--ns-line:rgba(255,255,255,.14);--ns-dd:rgba(8,11,17,.99);
  --ns-surf:rgba(255,255,255,.06);--ns-surf2:rgba(255,255,255,.04);--ns-input:rgba(0,0,0,.55)}
.ns-side[data-theme="light"]{--ns-fg:#1a2230;--ns-fg2:#20293a;--ns-line:rgba(15,23,38,.14);--ns-dd:rgba(255,255,255,.99);
  --ns-surf:rgba(15,23,38,.055);--ns-surf2:rgba(15,23,38,.04);--ns-input:rgba(255,255,255,.86)}
.ns-side[data-theme="light"]{color:#1a2230}
.ns-side[data-theme="light"] .kv>b{color:#5b6478}
.ns-side[data-theme="light"] .ns-hist{border-top-color:rgba(15,23,38,.12)}
.ns-side[data-theme="light"] .ns-side-hd h4{color:#1a2230}
.ns-side .ns-mini{background:var(--ns-surf);color:var(--ns-fg)}
.ns-side .ns-ta{background:var(--ns-input);color:var(--ns-fg);border-color:var(--ns-line)}

/* ===== v33 修复点击命中：关闭态抽屉必须完全不吃事件 ===== */
.ns-side{pointer-events:none!important;visibility:hidden}
.ns-side.on{pointer-events:auto!important;visibility:visible}
@media (min-width:900px){
  /* 贴面板左侧，绝不与面板重叠：面板右距 22px + 宽 340px + 12px 间隙 */
  .ns-side{left:auto!important;right:calc(22px + 340px + 12px)!important;top:96px!important;bottom:96px!important}
}
@media (max-width:899px){
  .ns-side{left:auto!important;right:12px!important;top:56px!important;bottom:56px!important}
}
/* 面板内部任何伪元素都不得拦截点击 */
.ns-panel::before,.ns-panel::after,.ns-panel .ns-sheen,.ns-panel .ns-track::after{pointer-events:none!important}
/* 折叠态预览在展开时应完全不吃事件（避免遮住标题栏按钮） */
.ns-peek,.ns-peek2{pointer-events:none!important}
.ns-panel.ns-collapsed:hover .ns-peek{pointer-events:none!important}
/* 标题栏与按钮：确保可点（cursor:grab 只用于拖拽区，不挡按钮） */
.ns-head .ns-btn,.ns-head .ns-thb,.ns-caps .ns-btn,.ns-caps .ns-thb{position:relative;z-index:3;pointer-events:auto!important}
.ns-head{cursor:default}
.ns-head [data-drag]{cursor:grab}

/* ===== v34 点击热区修复 ===== */
/* 1) 层级拉满，避免被 DSH 自己的浮层/侧栏压住 */
#ns-host{z-index:2147483647!important}
/* 2) 面板内一切可交互元素显式 auto，杜绝继承到 none */
.ns-panel,.ns-panel *{pointer-events:auto}
.ns-panel::before,.ns-panel::after,.ns-panel .ns-sheen,.ns-panel .ns-track::after,
.ns-panel .ns-fill,.ns-panel .ns-fill::after{pointer-events:none!important}
/* 3) 关闭态抽屉彻底不占位 */
.ns-side{pointer-events:none!important;visibility:hidden}
.ns-side.on{pointer-events:auto!important;visibility:visible}
/* 4) 标题栏按钮 24 → 32，并把命中区扩到 40 */
.ns-btn,.ns-thb{width:32px!important;height:32px!important;min-width:32px;font-size:13px}
.ns-btn::after,.ns-thb::after{content:'';position:absolute;inset:-4px}
.ns-btn,.ns-thb{position:relative}
.ns-head .ns-btn,.ns-head .ns-thb{place-self:center}
/* 5) 折叠按钮与主题按钮之间留足间距，避免互相吃掉 */
.ns-head .ns-theme{margin-left:auto;margin-right:4px}
.ns-head .ns-pct{margin-left:0;margin-right:6px}
/* 6) 底部不再遮住列表：缩小 footer、加大 body 可视区 */
.ns-panel{max-height:calc(100vh - 96px)!important}
.ns-body{max-height:none!important;flex:1 1 auto;min-height:0;overflow-y:auto;padding-bottom:10px!important}
.ns-foot{padding:7px 16px 8px!important;min-height:0;flex:none!important}
.ns-foot .ns-ghost{padding:5px 10px;font-size:11.5px}
.ns-actlist{max-height:none!important;overflow:visible!important}
/* 7) 台账行整行可点、视觉上明确 */
.ns-list .ns-row{cursor:pointer}
.ns-list .ns-row>*{pointer-events:none}   /* 点哪都归整行，避免子元素吃掉事件 */
/* 8) 抽屉内部元素要能点（上面的 * 兜底已覆盖，这里明确一遍） */
.ns-side,.ns-side *{pointer-events:auto}
.ns-side:not(.on),.ns-side:not(.on) *{pointer-events:none!important}

/* v35 小视口：footer 不再挤占，body 保底高度 */
.ns-panel{overflow:hidden}
.ns-body{overflow-y:auto!important}
.ns-foot{position:relative;z-index:4;background:var(--ns-dd,rgba(13,19,30,.98))}

/* v36 面板留出上下边距，避免贴边被裁（bottom 96 + max-height 会顶出屏幕） */
.ns-panel{max-height:calc(100vh - 132px)!important}
@media (max-height:720px){ .ns-panel{max-height:calc(100vh - 40px)!important;bottom:20px!important} }

/* ===== v37 抽屉定位最终版（覆盖此前所有重复定义） ===== */
.ns-side{
  left:auto!important;right:auto!important;
  top:50%!important;bottom:auto!important;
  transform:translateY(-50%) translateX(24px)!important;
  width:min(320px, calc(100vw - 400px))!important;
  max-height:calc(100vh - 140px)!important;
  border-radius:16px!important;
  border:1px solid var(--ns-line,rgba(255,255,255,.22))!important;
  box-shadow:0 22px 54px -20px rgba(0,0,0,.75)!important;
}
.ns-side.on{transform:translateY(-50%) translateX(0)!important}
/* 宽屏：钉在面板左边，留 12px 间隙 */
@media (min-width:960px){
  .ns-side{right:calc(22px + 340px + 12px)!important}
}
/* 窄屏：抽屉从右侧覆盖，但给面板留出关闭按钮的位置（顶部让开 52px） */
@media (max-width:959px){
  .ns-side{right:12px!important;width:min(320px,calc(100vw - 24px))!important;max-height:calc(100vh - 120px)!important}
}
/* 折叠态时面板只有 186px，抽屉位置跟着收 */
.ns-panel.ns-collapsed ~ .ns-side{right:calc(22px + 186px + 12px)!important}

/* v37b 偏离 NEW 徽章 + 折叠态间距 */
.ns-new{font-size:9.5px;padding:0 5px;border-radius:6px;background:rgba(255,120,90,.9);color:#1a0a06;font-weight:700;letter-spacing:.5px;margin-left:4px}
.ns-panel[data-theme="light"] .ns-new{background:#e2503a;color:#fff}
